# 在 macOS 上与网易 UU 双开时使用。先启动 UU 加速，再启用 Clash TUN。
# 将 UU 使用的 8 条 IPv4 路由各拆成两个更具体的子网，并从中移除
# 163.163.0.0/16。UU 登录地址继续匹配 UU 路由，其余公网 IPv4 优先匹配 Clash。
tun:
  route-address:
    - 1.0.0.0/9
    - 1.128.0.0/9
    - 2.0.0.0/8
    - 3.0.0.0/8
    - 4.0.0.0/7
    - 6.0.0.0/7
    - 8.0.0.0/6
    - 12.0.0.0/6
    - 16.0.0.0/5
    - 24.0.0.0/5
    - 32.0.0.0/4
    - 48.0.0.0/4
    - 64.0.0.0/3
    - 96.0.0.0/3
    - 128.0.0.0/3
    - 160.0.0.0/7
    - 162.0.0.0/8
    - 163.0.0.0/9
    - 163.128.0.0/11
    - 163.160.0.0/15
    - 163.162.0.0/16
    - 163.164.0.0/14
    - 163.168.0.0/13
    - 163.176.0.0/12
    - 163.192.0.0/10
    - 164.0.0.0/6
    - 168.0.0.0/5
    - 176.0.0.0/4
    - 192.0.0.0/2
