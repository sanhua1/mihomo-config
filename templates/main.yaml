# Mihomo 通用运行配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false

# 持久化运行状态
profile:
  store-selected: true
  store-fake-ip: true

# 识别连接中的真实域名
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  force-domain:
    - +.v2ex.com
  skip-domain:
    - dlg.io.mi.com
    - +.push.apple.com
    - +.apple.com
    - +.wechat.com
    - +.qpic.cn
    - +.qq.com
    - +.wechatapp.com
    - +.vivox.com
    - +.oray.com
    - +.sunlogin.net
    - +.msftconnecttest.com
    - +.msftncsi.com

# 接管系统流量
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# 保留现有 fake-ip DNS 行为
dns:
  enable: true
  concurrent: true
  query-timeout: 3000
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - +.ntp.ntsc.ac.cn
    - +.cn.ntp.org.cn
    - +.market.xiaomi.com
    - localhost.ptlogin2.qq.com
    - "*.msftncsi.com"
    - www.msftconnecttest.com
  default-nameserver:
    - tls://223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - tls://223.5.5.5
    - 119.29.29.29
  direct-nameserver-follow-policy: false
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "+.115.com": 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

# 动态节点策略组
proxy-groups:
  - name: ✈️ 节点选择
    type: select
    include-all: true
    exclude-filter: '(?i)(剩余|流量|套餐|到期|过期|官网|客服|联系|网址|更新|建议|群组)'

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - ✈️ 节点选择
      - 🎯 全球直连

# 服务分流策略组
